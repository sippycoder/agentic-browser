[project]
name = "agentic-browser"
version = "0.1.0"
description = "Minimal agentic browser prototype: real Chromium + hierarchical LLM agents + rubric evals"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40",
    "openai>=1.0",
    "anthropic>=0.40",
    "pyyaml>=6.0",
    "croniter>=2.0",
    "mcp>=2.0",
]

[project.scripts]
agentic-browser = "agentic_browser.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
